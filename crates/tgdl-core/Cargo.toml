[package]
name = "tgdl-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["telegram", "mock"]
telegram = ["dep:grammers-client", "dep:grammers-session", "dep:grammers-tl-types"]
mock = []

[dependencies]
tokio = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
grammers-client = { workspace = true, optional = true }
grammers-session = { workspace = true, optional = true }
grammers-tl-types = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
