[package]
name = "tgdl-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tgdl-ui"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dependencies]
tgdl-core = { path = "../tgdl-core" }
dioxus = { version = "0.7", features = ["desktop"] }
futures-channel = "0.3"
futures-util = "0.3"
tokio = { workspace = true }
